<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cadastro de Cliente</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h2>Cadastro de Cliente</h2>

  <form action="cadastro.php" method="POST">

    <label for="nome">Nome:</label> <input type="text" id="nome" name="nome" required> <br>

    <label for="matricula">Matricula</label> <input type="text" id="matricula" name="matricula" required> <br>

    <label for="funcao">Função:</label>  <input type="text" id="funcao" name="funcao" required> <br>

    <label for="departamento">Departamento:</label> <input type="text" id="departamento" name="departamento" required> <br>

    <label for="idade">Idade:</label> <input type="text" id="idade" name="idade" required> <br>

    <label for="cpf">Cpf:</label> <input type="text" id="cpf" name="cpf" required> <br>
    
    <label for="rg">RG:</label> <input type="text" id="rg" name="rg" required> <br>

    <label for="salario">Salário:</label> <input type="text" id="salario" name="salario" required> <br>

    <label for="endereco">Endereço:</label>  <input type="text" id="endereco" name="endereco" required> <br>

    <label for="uf">UF:</label>  <input type="text" id="uf" name="uf" required> <br>

    <label for="pais">País:</label>  <input type="text" id="pais" name="pais" required> <br>


    <button type="submit">Cadastrar Funcionário</button>

  </form>
</body>
</html>
